.th.s{width:22px;height:22px;border-radius:6px;cursor:inherit}

if(n){items.push({name:n,dose:fd.get('dose')||''});if(!L('drug').some(x=>x.name==n))mk('drug',{date:today(),time:'',name:n,start:o.date,purpose:(fd.get('purpose')||'').trim(),dose:fd.get('dose')||''})}
if(!items.length){toast('เลือกหรือพิมพ์ชื่อยาอย่างน้อย 1 ตัว');return false}
items.forEach(i=>mk('med',{...o,...i,status:d.status}));const pf=form.querySelector('input[type=file]').files[0];changed();toast('บันทึกยา '+items.length+' ตัวแล้ว');if(n&&pf)shrink(pf).then(u=>{const x=L('drug').find(y=>y.name==n);if(x){x.photo=u;x.updated_at=now();changed()}},()=>toast('ใช้รูปนี้ไม่ได้ ลองรูปอื่น'));return false}
if(k=='sym'){const n=(d.custom||d.sym||'').trim();if(!n){toast('เลือกหรือพิมพ์ชื่ออาการ');return false}Object.assign(o,{name:n,severity:+d.severity})}
if(k=='mood')Object.assign(o,{mood:d.mood,score:+d.score,energy:+d.energy});
if(k=='food')Object.assign(o,{meal:d.meal,name:d.name.trim()});
add(k,o);toast('บันทึกแล้ว');return false}
function rng(){const t=today();if(R=='7')return[addD(t,-6),t];if(R=='sel'){const[y,m]=M;return[`${y}-${String(m+1).padStart(2,'0')}-01`,new Date(Date.UTC(y,m+1,0)).toISOString().slice(0,10)]}if(R=='day')return[CD,CD];if(R=='cus')return CR;return['0000-01-01',t]}
const bars=(o,fmt=v=>v)=>{const mx=Math.max(1,...Object.values(o));return Object.entries(o).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=bar><span style="min-width:90px">${esc(k)}</span><i style="width:${v/mx*60}%"></i>${fmt(v)}</div>`).join('')||'<p class=mu>ไม่มีข้อมูลในช่วงนี้</p>'};
function dash(){const[a,b]=rng();return`<div class=card>${fbar(1)}</div>${report(a,b,1)}`}
function sett(){return`<div class=card><h3>รายการยา</h3>${L('drug').map(x=>EDD==x.id?`<div class=ev style="display:block">${drugForm(x)}</div>`:`<div class=ev><span>${im(x.photo,1)}<b>${esc(x.name)}</b> ${esc(x.dose)} · เริ่ม ${esc(x.start)}${x.purpose?'<br><span class=mu>กินเพื่อ: '+esc(x.purpose)+'</span>':''}</span><span style="white-space:nowrap"><button class=b onclick="EDD='${x.id}';render()">แก้ไข</button> <label class=b>📷 ${x.photo?'เปลี่ยนรูป':'เพิ่มรูป'}<input type=file accept="image/*" style="display:none" onchange="setPhoto('${x.id}',this)"></label> ${x.photo?`<button class=b onclick="rmPhoto('${x.id}')">ลบรูป</button> `:''}<button class=b onclick="del('${x.id}')">ลบ</button></span></div>`).join('')}
<form onsubmit="return addDrug(this)"><input type=text name=name placeholder="ชื่อยา" required><input type=text name=dose placeholder="ขนาดปกติ เช่น 1 เม็ด"><input type=text name=purpose placeholder="กินเพื่ออะไร เช่น แก้ปวดหัว"><div class=row><span class=mu>รูปยา (ไม่บังคับ)</span><input type=file accept="image/*"></div><div class=row><span class=mu>วันเริ่มกิน</span><input type=date name=start value="${today()}" required><button class="b p">เพิ่มยา</button></div></form></div>
<div class=card><h3>อารมณ์ที่เพิ่มเอง</h3>${L('cmood').map(x=>`<div class=ev><span>${esc(x.emoji)} ${esc(x.name)}</span><button class=b onclick="del('${x.id}')">ลบ</button></div>`).join('')||'<p class=mu>เพิ่มได้ในหน้าบันทึกรายวัน ตรงส่วนอารมณ์</p>'}</div>
<div class=card><h3>เชื่อมต่อ Google Sheets</h3><p class=mu>สถานะ: <b>${esc(S.st||(S.hook?'เชื่อมต่อแล้ว':'ยังไม่เชื่อมต่อ'))}</b>${S.dirty?' · มีข้อมูลรอซิงค์':''}<br>ซิงค์สำเร็จล่าสุด: ${esc(S.last)||'-'}</p>
<input type=text id=hu placeholder="วาง Web app URL (https://script.google.com/…/exec)" value="${esc(S.hook)}"><input type=password id=hk placeholder="รหัสลับ (ตัวเดียวกับใน Apps Script)" value="${esc(S.key)}" autocomplete=off>
<div class=row><button class="b p" onclick="saveHook()">${S.hook?'บันทึกและซิงค์':'เชื่อมต่อ'}</button>${S.hook?'<button class=b onclick="sync()">ซิงค์ตอนนี้</button>':''}${CLIENT_ID.startsWith('YOUR_')?'':'<button class=b onclick="syncG()">เชื่อมด้วย OAuth</button>'}<button class=b onclick="csv()">ส่งออก CSV</button>${S.hook?'<button class=b onclick="unHook()">ตัดการเชื่อมต่อ</button>':''}</div></div>
<div class=card><h3>ข้อมูล</h3><p class=mu>เขตเวลา: Asia/Bangkok</p>${hasSample()?'<button class=b onclick="S.recs=S.recs.filter(r=>!String(r.id).startsWith(\'s-\'));changed()">ลบข้อมูลตัวอย่างทั้งหมด</button>':''}</div>`}
function csv(){const rows=[['kind','id','date','time','detail','notes','updated_at','deleted']];real().forEach(r=>rows.push([r.kind,r.id,r.date,r.time,K[r.kind][1].filter(c=>c!='photo').map(c=>r[c]).join(' | '),r.notes,r.updated_at,r.deleted]));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n')],{type:'text/csv'}));a.download='health-tracker.csv';a.click()}
// ====== Google Sheets sync ======
let tok='',busy=0;
function auth(){return new Promise((ok,no)=>{const go=()=>google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/drive.file',error_callback:e=>no(new Error(e.type||'ปิดหน้าต่างล็อกอิน')),callback:r=>r.access_token?(tok=r.access_token,ok()):no(new Error(r.error||'auth'))}).requestAccessToken();
if(window.google&&google.accounts)return go();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=go;s.onerror=()=>no(new Error('โหลด Google ไม่ได้ (ต้องเปิดผ่าน GitHub Pages/https)'));document.head.appendChild(s)})}
async function api(p,o={}){const r=await fetch('https://sheets.googleapis.com/v4/spreadsheets'+p,{...o,headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'}});if(r.status==401){tok='';throw new Error('หมดอายุ กดซิงค์อีกครั้ง')}if(!r.ok)throw new Error(((await r.json().catch(()=>({}))).error||{}).message||r.status);return r.json()}
const hdr=k=>['id','date','time',...K[k][1],'notes','created_at','updated_at','deleted'];
async function syncG(n=0){if(busy)return;busy=1;try{S.st='กำลังซิงค์…';render();if(CLIENT_ID.startsWith('YOUR_'))throw new Error('ยังไม่ได้ใส่ Client ID — ใช้วิธีเชื่อมด้วย Web app URL แทน');if(!tok)await auth();
if(!S.sheet){S.sheet=(await api('',{method:'POST',body:JSON.stringify({properties:{title:'Health Tracker',timeZone:'Asia/Bangkok'},sheets:Object.values(K).map(k=>({properties:{title:k[0]}}))})})).spreadsheetId;save()}
for(const k in K){const h=hdr(k),tab=K[k][0],j=await api(`/${S.sheet}/values/${tab}!A:Z`);
(j.values||[]).slice(1).forEach(row=>{const o={kind:k};h.forEach((c,i)=>o[c]=NUM.includes(c)?Number(row[i]):(row[i]??''));if(!o.id)return;const l=S.recs.find(x=>x.id==o.id);if(!l)S.recs.push(o);else if(o.updated_at>l.updated_at)Object.assign(l,o)});
await api(`/${S.sheet}/values/${tab}!A1?valueInputOption=RAW`,{method:'PUT',body:JSON.stringify({values:[h,...real().filter(r=>r.kind==k).map(r=>h.map(c=>r[c]??''))]})})}
S.st='ซิงค์สำเร็จ';S.last=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'});S.dirty=0}
catch(e){S.st='ซิงค์ล้มเหลว: '+e.message;busy=0;save();if(n<2&&tok){setTimeout(()=>sync(n+1),3000*(n+1))}toast(S.st)}
busy=0;save();render()}
function sync(n=0){return S.hook?syncH(n):syncG(n)}
async function syncH(n=0){if(busy)return;busy=1;try{S.st='กำลังซิงค์…';render();
const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),45000);
const r=await fetch(S.hook,{method:'POST',body:JSON.stringify({secret:S.key,recs:real()}),signal:ctl.signal});clearTimeout(tm);
const j=await r.json();if(j.error)throw new Error(j.error=='wrong secret'?'รหัสลับไม่ตรงกับใน Apps Script':j.error);
j.recs.forEach(o=>{const l=S.recs.find(x=>x.id==o.id);if(!l)S.recs.push(o);else if(String(o.updated_at)>String(l.updated_at))Object.assign(l,o)});
S.st='ซิงค์สำเร็จ';S.last=new Date().toLocaleString('th-TH',{timeZone:'Asia/Bangkok'});S.dirty=0}
catch(e){S.st='ซิงค์ล้มเหลว: '+(e.name=='AbortError'?'หมดเวลา':e.message=='Failed to fetch'?'เชื่อมต่อไม่ได้ ตรวจว่าสิทธิ์เป็น Anyone และใช้ URL ที่ลงท้าย /exec':e.message);busy=0;save();if(n<2)setTimeout(()=>sync(n+1),3000*(n+1));toast(S.st)}
busy=0;save();render()}
function saveHook(){const u=$('hu').value.trim(),k=$('hk').value.trim();if(!/^https:\/\/script\.google\.com\//.test(u)){toast('ลิงก์ต้องขึ้นต้นด้วย https://script.google.com/');return}if(!k){toast('ใส่รหัสลับด้วย');return}S.hook=u;S.key=k;save();sync()}
function unHook(){S.hook='';S.key='';S.st='';save();render()}
function render(){const t=[['cal','ปฏิทิน'],['dash','สรุป'],['set','ตั้งค่า']];
$('app').innerHTML=`<div class=nav>${t.map(([v,n])=>`<button class="${V==v||(V=='day'&&v=='cal')?'on':''}" onclick="go('${v}')">${n}</button>`).join('')}</div>
${hasSample()?'<div class=card style="border-color:var(--y)">⚠️ กำลังแสดง <b>ข้อมูลตัวอย่าง</b> (ไม่ถูกส่งไป Google Sheets) — ลบได้ในหน้าตั้งค่า</div>':''}
${V=='cal'?cal():V=='day'?day():V=='dash'?dash():sett()}
<p class=mu style="text-align:center">แสดงเฉพาะข้อมูลที่บันทึก ไม่ใช่การวินิจฉัยทางการแพทย์ ${S.st?' · '+esc(S.st):''}</p>`}
render();if(S.hook)sync();
</script></body></html>
